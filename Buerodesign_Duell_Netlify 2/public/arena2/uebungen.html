/* Fachlich korrekte Buchungs-T-Konten: Soll / Kontoname / Haben oberhalb des Strichs. */
.book-ledger .t-heading{padding-bottom:3px}
.book-ledger .t-body{align-items:stretch}
.book-ledger .t-side{padding:9px 9px 13px;min-height:156px}
.book-ledger .t-entry{margin-bottom:6px;align-items:baseline}
.book-ledger .book-history{min-height:48px}
.book-ledger .book-history .t-entry:first-child{font-weight:700}
.book-ledger .book-current{border-top:1px dashed #c6d8ca;margin-top:9px;padding-top:8px}
.book-ledger .book-current .t-inputs{grid-template-columns:minmax(0,1.2fr) minmax(0,.78fr)}
.book-ledger .book-current .t-inputs input{text-align:left}
.book-ledger .book-current .t-inputs label:last-child input{text-align:right}
.book-ledger .entry-numb{display:block;color:#286443;font-size:11px;margin-bottom:7px;font-weight:700}
.book-instructions{padding:13px 16px;border:1px solid #c4ddca;background:#f1f8f1;border-radius:10px;margin:15px 0;line-height:1.55}
.book-instructions strong{color:#125e37}
.book-ledger .t-inputs input[readonly]{background:#f6faf7}
@media(max-width:730px){.book-ledger .book-current .t-inputs{grid-template-columns:minmax(0,1fr)}.book-ledger .t-side{padding:9px 6px 12px}}

/* Verbindliche Bilanzdarstellung: Aktiva links / Passiva rechts außen.
   Unterschiedliche Positionszahlen werden mit flexiblem Leerraum vor den
   auf derselben Grundlinie stehenden Bilanzsummen ausgeglichen. */
.bal-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch;overflow-x:visible}
.bal-cols>.balance-side{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.bal-cols .balance-header{display:flex;align-items:center;justify-content:flex-start;min-height:49px;padding:10px 13px;background:#edf5ee;font-size:14px;font-weight:800}
.bal-cols .balance-header.is-passiva{justify-content:flex-end;text-align:right}
.bal-cols .balance-entries{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.bal-cols .balance-entry{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:10px;align-items:start;min-height:46px;padding:10px 12px;border-bottom:1px solid #edf1ec;font-size:13px}
.bal-cols .balance-entry.focus{background:#e1f4e7}
.bal-cols .balance-entry-name{min-width:0;overflow-wrap:break-word}
.bal-cols .balance-entry-amount{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bal-cols .balance-sum{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:8px;align-items:center;min-height:56px;padding:10px 12px;background:#f2f9f3;border-top:2px solid #93b9a0;font-size:14px}
.bal-cols .balance-sum-amount{white-space:nowrap;font-variant-numeric:tabular-nums;border-bottom:3px double #597564;padding-bottom:2px;text-align:right}
/* Auch auf kleinen Geräten müssen die zwei Bilanzhälften nebeneinander bleiben.
   Horizontaler Scrollbereich verhindert unleserlich schmale Bilanzspalten. */
@media(max-width:620px){
 .bal-cols{grid-template-columns:repeat(2,minmax(260px,1fr));overflow-x:auto;gap:8px;max-width:100%;padding-bottom:4px}
 .bal-cols .balance-entry{padding:9px 10px;font-size:12px;gap:6px}
 .bal-cols .balance-header{padding:9px 10px}
 .bal-cols .balance-sum{padding:9px 10px;font-size:12px}
}


/* Lernarena 2 · Kontoeröffnung: alle Eingaben direkt im T-Konto */
.opening-modes{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 14px}
.opening-modes button{min-height:46px;background:#fff}
.opening-modes button.is-active{border-color:#00884b;background:#edf8f0;color:#006f3d;box-shadow:inset 0 0 0 1px #00884b}
.opening-worksheet{max-width:920px;margin:auto}
.opening-ledger{border:0;border-radius:0;box-shadow:none;padding:9px 4px 20px;overflow:visible}
.opening-ledger .t-heading{display:grid;grid-template-columns:minmax(48px,1fr) minmax(165px,3fr) minmax(48px,1fr);align-items:end;gap:7px;padding:0 8px 3px;margin:0}
.opening-ledger .t-heading > span:first-child{text-align:left}
.opening-ledger .t-heading > span:last-child{text-align:right}
.opening-ledger .opening-name-slot{display:block;min-width:0}
.opening-ledger .opening-name-input{min-height:38px;max-height:48px;width:100%;padding:5px 4px 4px;text-align:center;font-weight:750;font-size:clamp(13px,1.55vw,16px);background:#f5f9f5;border:1px dashed #96b7a0;border-radius:5px}
.opening-ledger .opening-name-input:read-only{border-color:transparent;background:transparent;color:#143b2a}
.opening-ledger .opening-name-input:disabled{color:#778579;background:#f6f8f6;opacity:1}
.opening-ledger .t-body{border-top:2px solid #24362b;grid-template-columns:1fr 1fr}
.opening-ledger .t-side{padding:12px 11px 16px;min-height:134px}
.opening-ledger .t-side:first-child{border-right:2px solid #24362b}
.opening-ledger .opening-entry-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(88px,1.04fr);align-items:center;gap:8px}
.opening-ledger .opening-entry-row input{font-size:14px;min-height:43px;padding:7px 8px}
.opening-ledger .opening-entry-row input.money-in{text-align:right;font-variant-numeric:tabular-nums}
.opening-ledger .unfilled-side{color:#9aa69c;font-size:12px;min-height:47px;display:flex;align-items:center}
.opening-ledger .opening-entry-row input:read-only{background:#f1f7f2;border-color:#d8e7d9}
.opening-help{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:space-between}
.opening-help button{min-width:190px}
.opening-current-data{margin-top:12px;border:1px solid #d2e5d7;border-radius:9px;padding:13px 16px;background:#f6faf7;display:flex;gap:10px 20px;align-items:center;flex-wrap:wrap}
.opening-current-data strong{color:#20442d;font-variant-numeric:tabular-nums}
.opening-instruction{font-size:13px;color:#5b6d60;line-height:1.55;margin:9px 0}
.opening-stage{padding:13px 16px;border:1px solid #dce8dd;border-radius:11px;background:#f9fcf9;margin:16px 0}
.opening-stage .step-tag{margin-bottom:9px;display:block}
@media(max-width:730px){.opening-ledger .t-heading{grid-template-columns:44px minmax(0,1fr) 44px;padding-left:2px;padding-right:2px;gap:4px}.opening-ledger .opening-name-input{font-size:13px}.opening-ledger .t-side{padding:9px 5px;min-height:138px}.opening-ledger .opening-entry-row{grid-template-columns:1fr;gap:4px}.opening-ledger .opening-entry-row input{font-size:13px}.opening-help button{width:100%}.opening-current-data{display:block}.opening-current-data>*{display:block;margin:3px 0}}

/* Kontenabschluss: Schüler tragen die beiden Summen direkt unter dem T-Konto ein */
.ledger-sample .t-footer.account-footer-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid #24362b}
.ledger-sample .account-footer-edit .account-total{min-width:0;display:flex;align-items:center;justify-content:flex-end;padding:6px 9px 7px;border-bottom:4px double #24362b;background:#fff}
.ledger-sample .account-footer-edit .account-total:first-child{border-right:2px solid #24362b}
.ledger-sample .account-footer-edit .account-total input{width:min(100%,170px);min-width:0;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(12px,1.4vw,15px);border:1px solid #a4bdae;border-radius:5px;background:#f9fcfa}
.ledger-sample .account-footer-edit .account-total input:read-only{border-color:transparent;background:#fff;color:#26382d}
.ledger-sample .account-footer-edit .account-total input:focus-visible{outline:3px solid #78b68e;outline-offset:2px}
.closing-step{border:1px solid #d6e5d9;background:#f9fcf9;border-radius:10px;padding:15px;margin:15px 0}
.closing-step h3{margin:0 0 8px;font-size:16px}
.closing-sub{font-size:13px;color:#587162;line-height:1.5}
@media(max-width:600px){.ledger-sample .account-footer-edit .account-total{padding:5px 5px 7px}.ledger-sample .account-footer-edit .account-total input{font-size:12px;padding:8px 4px}.closing-step{padding:12px}}

/* Geschäftsfall-Werkstatt: T-Konten immer untereinander, drei getrennte Buchungsfelder */
.ledger-grid{grid-template-columns:minmax(0,1fr)!important;gap:18px;max-width:990px;margin-left:auto;margin-right:auto}
.book-ledger{width:100%;padding:18px 17px 20px}
.book-ledger .t-heading{font-size:14px;min-height:25px;line-height:1.25}
.book-ledger .t-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:2px solid #29372d}
.book-ledger .t-side{min-width:0;padding:12px 14px 18px;min-height:140px}
.book-ledger .t-side:first-child{border-right:2px solid #29372d}
.book-ledger .book-history{min-height:45px}
.book-ledger .t-entry{font-size:13px;gap:10px}
.book-ledger .book-current{margin-top:8px;padding-top:10px;border-top:1px dashed #cadccf}

/* Abschlusswerkstatt: Rechenstriche, vorläufige Buchungssummen und SBK

function numberedCounter(text,caseNumber,counterId){

/* Finger- und Stiftzeichnungen dürfen leicht wellig und schief sein.
   Bewertet wird die fachlich erkennbare Form, nicht Pixelgenauigkeit. */
function validHorizontal(points){
 if(!Array.isArray(points)||points.length<2)return false;
 const ps=points.filter(p=>Array.isArray(p)&&p.length>=2&&p.every(Number.isFinite));
 if(ps.length<2)return false;
 const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);
 const spanX=Math.max(...xs)-Math.min(...xs);
 const spanY=Math.max(...ys)-Math.min(...ys);
 const middleY=ys.reduce((sum,y)=>sum+y,0)/ys.length;
 // Bei einer handgezeichneten Linie sind leichte Wellen und schräge Enden erlaubt.
 // Ein senkrechter Strich oder eine steile Diagonale zählt weiterhin nicht.
 const endSlope=Math.abs(ps[ps.length-1][1]-ps[0][1]);
 return spanX>=.53&&spanY<=.39&&endSlope<=.31&&middleY>=.035&&middleY<=.965;
}
function validNose(points){
 if(!Array.isArray(points)||points.length<3)return false;
 const ps=[...points].sort((a,b)=>a[0]-b[0]);
 const left=ps.filter(p=>p[0]<.24),right=ps.filter(p=>p[0]>.76);
 if(!left.length||!right.length)return false;
 const avgy=a=>a.reduce((sum,p)=>sum+p[1],0)/a.length;
 const rise=avgy(left)-avgy(right);
 const extent=ps[ps.length-1][0]-ps[0][0];
 // Eine Buchhalternase verläuft links zunächst tiefer und steigt nach rechts an.
 // Eine etwas unruhige handschriftliche Form bleibt zulässig.
 return extent>.64 && rise>.22 && rise<.92 && avgy(left)>.35 && avgy(right)<.67;
}
/* Schätzt die Höhe einer gezeichneten Linie an einer x-Position. Die Punkte
   dürfen auch von rechts nach links gezeichnet sein. */
function strokeYAt(points,x){
 let best=null,nearest=Infinity;
 for(let i=1;i<points.length;i++){
  const a=points[i-1],b=points[i],dx=b[0]-a[0];
  if(Math.abs(dx)<.0001)continue;
  const t=Math.max(0,Math.min(1,(x-a[0])/dx));
  const projected=a[0]+t*dx;
  const distance=Math.abs(projected-x);
  if(distance<nearest){nearest=distance;best=a[1]+t*(b[1]-a[1]);}
 }
 return nearest<.06?best:null;
}
function validDouble(strokes){
 // Doppelstriche müssen zwei separate Zeichengesten sein – nicht eine Geste,
 // nicht ein mehrfach übermalter Strich, aber auch nicht millimetergenau parallel.
 if(!Array.isArray(strokes)||strokes.length!==2||!strokes.every(validHorizontal))return false;
 const [first,second]=strokes;
 const bounds=p=>[Math.min(...p.map(x=>x[0])),Math.max(...p.map(x=>x[0]))];
 const [a0,a1]=bounds(first),[b0,b1]=bounds(second);
 const left=Math.max(a0,b0),right=Math.min(a1,b1);
 if(right-left<.43)return false;
 const distances=[];
 for(let i=0;i<=12;i++){
  const x=left+(right-left)*i/12;
  const y1=strokeYAt(first,x),y2=strokeYAt(second,x);
  if(y1!==null&&y2!==null)distances.push(Math.abs(y1-y2));
 }
 if(distances.length<9)return false;
 const mean=distances.reduce((sum,d)=>sum+d,0)/distances.length;
 const recognizablySeparate=distances.filter(d=>d>=.052).length;
 // Berührungen oder ein einzelnes Kreuzen sind in Ordnung. Über weite Strecken
 // deckungsgleiche Linien dürfen dagegen nicht als Doppelstrich zählen.
 return mean>=.065&&mean<=.36&&recognizablySeparate>=Math.ceil(distances.length*.4);
}
function checkCloseComplete(){

  const lines=endDrawnStrokes(o,'top',side);
  return lines.length===1&&(noseSide===side?validNose(lines[0]):validHorizontal(lines[0]));

 const lineOk=expectedLine('soll')&&expectedLine('haben');
 const doubleOk=validDouble(endDrawnStrokes(o,'double','soll'))&&validDouble(endDrawnStrokes(o,'double','haben'));
 const sbOk=o.sbSide===a.lowSide&&nrm(o.sbText)==='sbk'&&Math.abs((pn(o.sbAmount)??-999)-c.sb)<.005;
 const sumsOk=['soll','haben'].every(side=>{
  const value=pn(o[side==='soll'?'sumSoll':'sumHaben']);
  return value!==null&&Math.abs(value-a.highTotal)<.005;
 });
 if(lineOk&&doubleOk&&sbOk&&sumsOk){o.finishOk=true;good('close-complete','Richtig! Der Schlussbestand, beide gleichen Kontensummen, die Abschlusslinien und die Doppelstriche stimmen.');}

  const problems=[];

  if(!sbOk)problems.push('SBK auf der richtigen Seite mit dem richtigen Betrag eintragen');

/* Speicherformat der Zeichnungen: jede handgezogene Linie bleibt bis zur
   Gesamtprüfung eigenständig bearbeitbar. Alte Teststände werden mitgelesen. */
function endDrawnStrokes(o,kind,side){
 const raw=kind==='top'?o.endTop?.[side]:o.endDouble?.[side];
 if(!Array.isArray(raw)||!raw.length)return [];
 if(Array.isArray(raw[0])&&typeof raw[0][0]==='number')return [raw]; // älterer einzelner Strich

}
function endStoreStrokes(o,kind,side,strokes){
 if(kind==='top')(o.endTop ||= {})[side]=strokes;
 else (o.endDouble ||= {})[side]=strokes;
 delete s.messages['close-complete'];
 persist();
}
function endStrokeDistance(stroke,point,width,height){
 let best=Infinity;
 for(let i=1;i<stroke.length;i++){
  const a=stroke[i-1],b=stroke[i],x=point[0]*width,y=point[1]*height;
  const ax=a[0]*width,ay=a[1]*height,bx=b[0]*width,by=b[1]*height;
  const vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy;
  const t=l2?Math.max(0,Math.min(1,((x-ax)*vx+(y-ay)*vy)/l2)):0;
  best=Math.min(best,Math.hypot(x-(ax+t*vx),y-(ay+t*vy)));
 }
 return best;
}
/* Geführtes Zeichnen: Die Bewegung der SuS wird erfasst, bevor eine
   saubere Linie erscheint. Ein Strich erzeugt NIE beide Summenstriche. */
function guidedStroke(kind,shape){
 if(kind==='double')return [
  [[.055,.29],[.945,.29]],
  [[.055,.64],[.945,.64]]
 ];
 if(shape==='nose')return [ [[.045,.80],[.47,.80],[.71,.22],[.96,.22]] ];
 return [ [[.045,.78],[.96,.78]] ];
}
/* Die Nase muss als Bewegung tatsächlich angedeutet werden. Eine waagerechte
   Linie oder einzelne schräge Gerade genügt nicht. Finger-Zittern ist erlaubt. */
function recognizableNoseGesture(points){
 if(!Array.isArray(points)||points.length<4)return false;
 const good=points.filter(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite));
 if(good.length<4)return false;
 const ps=[...good].sort((a,b)=>a[0]-b[0]);
 const left=ps[0],right=ps[ps.length-1];
 const span=right[0]-left[0],rise=left[1]-right[1];
 if(span<.42||rise<.20||rise>.9)return false;
 const a=strokeYAt(good,left[0]+span*.20),b=strokeYAt(good,left[0]+span*.80);
 if(a===null||b===null)return false;
 const leftLevel=Math.abs(left[1]-a),rightLevel=Math.abs(b-right[1]);
 const threshold=Math.max(.085,rise*.18);
 return (leftLevel<=threshold || rightLevel<=threshold)
   && leftLevel+rightLevel<rise*.52;
}
function recognizableStraightGesture(points){
 if(!points||points.length<2)return false;
 const first=points[0],last=points[points.length-1];
 const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
 return Math.max(...xs)-Math.min(...xs)>.32
   && Math.abs(last[1]-first[1])<.28
   && Math.max(...ys)-Math.min(...ys)<.38;
}
function attachCanvas(){
 document.querySelectorAll('[data-end-draw]').forEach(canvas=>{
  const c=closingCases[s.closeIndex];if(!c)return;
  const o=s.closing[c.id] ||= {},[kind,side]=canvas.dataset.endDraw.split(':');
  const scale=Math.min(3,window.devicePixelRatio||1),w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h)return;
  canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
  const ctx=canvas.getContext('2d');ctx.setTransform(scale,0,0,scale,0,0);
  const read=()=>endDrawnStrokes(o,kind,side);
  let activePointer=null,trace=[];
  canvas.classList.toggle('eraser-active',endDrawTool==='eraser');
  const feedback=text=>{
   const box=document.getElementById('drawing-feedback');
   if(box){box.textContent=text;box.hidden=!text;}
  };
  const pos=e=>{
   const r=canvas.getBoundingClientRect();
   return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];
  };
  const drawSet=(strokes,{opacity=1,dash=[],width=2.6,color='#1b4d31'}={})=>{
   ctx.save();ctx.globalAlpha=opacity;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
   ctx.strokeStyle=color;ctx.setLineDash(dash);
   for(const pts of strokes){
    if(!pts||pts.length<2)continue;
    ctx.beginPath();ctx.moveTo(pts[0][0]*w,pts[0][1]*h);
    for(const p of pts.slice(1))ctx.lineTo(p[0]*w,p[1]*h);
    ctx.stroke();
   }
   ctx.restore();
  };
  const paint=()=>{
   ctx.clearRect(0,0,w,h);
   // Leichte Orientierungsmarkierungen, keine vorab ausgefüllten Striche.
   if(kind==='double' && read().length<2){
    const existing=read();
    const hints=guidedStroke('double').filter((_,i)=>!existing.some(line=>Math.abs(line[0][1]-guidedStroke('double')[i][0][1])<.09));
    drawSet(hints,{opacity:.28,dash:[3,8],width:1.3,color:'#98b5a1'});
   }
   if(!read().length&&!trace.length){
    ctx.save();ctx.fillStyle='#789684';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(kind==='double'?'Striche einzeln ziehen':'↔ hier ziehen',w/2,Math.min(h-7,Math.max(15,h*.56)));
    ctx.restore();
   }
   drawSet(read());
   // Während der Bewegung sieht man nur die eigene angedeutete Linie.
   if(trace.length>=2)drawSet([trace],{opacity:.72,dash:[5,3],width:3.1,color:'#12864c'});
  };
  const eraseAt=e=>{
   const p=pos(e),strokes=read();let chosen=-1,nearest=Infinity;
   for(let i=0;i<strokes.length;i++){
    const d=endStrokeDistance(strokes[i],p,w,h);
    if(d<nearest){nearest=d;chosen=i;}
   }
   if(chosen>=0&&nearest<=Math.max(15,Math.min(22,h*.30))){
    strokes.splice(chosen,1);
    endStoreStrokes(o,kind,side,strokes);
    feedback('Linie entfernt. Du kannst sie neu zeichnen.');
    document.querySelector('#message-close-complete')?.replaceChildren();
    paint();
   }
  };
  paint();
  if(canvas.dataset.disabled==='true')return;
  canvas.addEventListener('pointerdown',e=>{
   if(activePointer!==null)return;
   activePointer=e.pointerId;
   canvas.setPointerCapture(e.pointerId);
   if(endDrawTool==='eraser')eraseAt(e);
   else{trace=[pos(e)];paint();}
   e.preventDefault();
  });
  canvas.addEventListener('pointermove',e=>{
   if(activePointer!==e.pointerId)return;
   if(endDrawTool!=='eraser'){
    const p=pos(e),last=trace[trace.length-1];
    if(!last||Math.hypot((p[0]-last[0])*w,(p[1]-last[1])*h)>2){trace.push(p);paint();}
   }else eraseAt(e);
   e.preventDefault();
  });
  canvas.addEventListener('pointerup',e=>{
   if(activePointer!==e.pointerId)return;
   if(endDrawTool!=='eraser'){
    trace.push(pos(e));
    if(kind==='top'){
     const valid=endDrawTool==='nose'?recognizableNoseGesture(trace):recognizableStraightGesture(trace);
     if(valid){
      endStoreStrokes(o,kind,side,guidedStroke('top',endDrawTool));
      feedback(endDrawTool==='nose'?'Buchhalternase erkannt und sauber nachgezogen.':'Gerade Linie erkannt und sauber nachgezogen.');
     }else feedback(endDrawTool==='nose'
      ?'Bitte die Buchhalternase andeuten: erst unten waagerecht, dann schräg nach oben, schließlich oben waagerecht.'
      :'Ziehe einen überwiegend waagerechten Strich von links nach rechts.');
    }else if(recognizableStraightGesture(trace)){
     const available=guidedStroke('double'),existing=read();
     const meanY=trace.reduce((sum,p)=>sum+p[1],0)/trace.length;
     let slot=meanY<.47?0:1;
     const filled=existing.some(line=>Math.abs(line[0][1]-available[slot][0][1])<.09);
     // Wiederholung auf einer belegten Höhe ersetzt nur diese Linie.
     if(filled){
      feedback('Diese Höhe ist bereits belegt. Ziehe den zweiten Strich auf der anderen gestrichelten Höhe.');
     }else{
      const result=[...existing,available[slot]].sort((a,b)=>a[0][1]-b[0][1]);
      endStoreStrokes(o,kind,side,result);
      feedback(result.length===1?'Erster Summenstrich gesetzt. Zeichne jetzt den zweiten einzeln.':'Beide Summenstriche sind gezeichnet.');
     }
    }else feedback('Ziehe den Summenstrich überwiegend waagerecht über das Feld.');
    document.querySelector('#message-close-complete')?.replaceChildren();
   }
   trace=[];activePointer=null;paint();e.preventDefault();
  });
  canvas.addEventListener('pointercancel',e=>{
   if(activePointer===e.pointerId){activePointer=null;trace=[];paint();}
   e.preventDefault();
  });
 });
}

const action={ 'opening-toggle-balance':()=>{s.openingBalanceOpen=!s.openingBalanceOpen;render()},'opening-toggle-ebk':()=>{s.openingEBKOpen=!s.openingEBKOpen;render()},'check-open-setup':checkOpenSetup,'check-open-name':checkOpenName,'check-open-kind':checkOpenKind,'check-open-ab':checkOpenAB,'open-next':openNext,'check-book-pair':checkBookPair,'check-book-posts':checkBookPosts,'book-next':()=>{s.bookIndex++;s.messages={};render();scrollTo(0,0)},'check-close-complete':checkCloseComplete,'end-draw-line':()=>{endDrawTool='line';render()},'end-draw-nose':()=>{endDrawTool='nose';render()},'end-draw-eraser':()=>{endDrawTool='eraser';render()},'close-next':()=>{s.closeIndex++;s.messages={};render();scrollTo(0,0)},'quiz-next':()=>{s.quizIndex++;render();scrollTo(0,0)},'open-again':()=>{s.openingIndex=0;s.openingQuiz=false;s.opening={};s.intermezzo={};render()},'quiz-again':()=>{s.quizIndex=0;s.quiz={};render()},'change-again':()=>{s.changeIndex=0;s.change={};render()},'book-again':()=>{s.bookIndex=0;s.book={};render()},'close-again':()=>{s.closeIndex=0;s.closing={};render()}};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){setView(g.dataset.go);return}const a=e.target.closest('[data-action]');if(a){action[a.dataset.action]?.();return}const placement=e.target.closest('[data-close-place]');if(placement){const c=closingCases[s.closeIndex],o=s.closing[c.id] ||= {};if(!o.finishOk){o.sbSide=placement.dataset.closePlace;/* Vorhandene Eingaben beim Wechsel der Kontenseite erhalten. */render()}return}const mode=e.target.closest('[data-opening-mode]');if(mode){s.openingSupport=mode.dataset.openingMode==='without'?'without':'with';s.openingBalanceOpen=s.openingSupport==='with';s.openingEBKOpen=false;render();return}const q=e.target.closest('[data-answer]');if(q){const token=q.dataset.answer;const pos=token.lastIndexOf(':');const path=token.slice(0,pos),n=Number(token.slice(pos+1));const question=path.startsWith('quiz.')?questions[Number(path.split('.')[1])]:questions[openingQuestionIndex(Number(path.split('.')[1]))];if(question)answerQuiz(question,n,path);return}});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.b){putPath(s,el.dataset.b,el.value);persist()}});
document.addEventListener('change',e=>{let el=e.target;if(el.name==='open-kind'){openCurrent().kind=el.value;persist()}else if(el.name==='nose'){let c=closingCases[s.closeIndex],o=s.closing[c.id] ||= {};o.noseChoice=el.value;o.points=[];o.noseOk=false;render()}else if(el.dataset.b){putPath(s,el.dataset.b,el.value);persist()}});
$('#reset').addEventListener('click',()=>{if(confirm('Alle Übungen und Eingaben zurücksetzen?')){s=fresh();render()}});
render();
})();
</script></body></html>
